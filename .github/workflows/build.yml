name: Gerar app Android e programa Windows

on:
  push:
    branches: [ main ]
    paths: [ "android/**", "desktop/**", ".github/workflows/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar Android
        run: gradle assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ../SalaMimi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SalaMimi.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Compilar Windows
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/SalaMimi-Setup.exe

  publicar:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sala-v${{ github.run_number }}
          name: Sala Mimi Explica v${{ github.run_number }}
          body: |
            Android: baixe SalaMimi.apk e instale.
            Windows: baixe SalaMimi-Setup.exe e instale.
          files: |
            SalaMimi.apk
            SalaMimi-Setup.exe
          make_latest: true
