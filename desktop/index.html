<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: wss: https: ws: http:; media-src * blob: mediastream:; img-src * data: blob:">
<title>Sala Mimi Explica</title>
<style>
:root{--bg:#0d0f13;--panel:#1d2027;--raised:#272b34;--line:#323744;--fg:#eceef2;--muted:#8e96a5;--accent:#37c99a;--rec:#ff4a4f;
  --font:"Segoe UI",system-ui,Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* início */
#home{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 16px}
#home h1{margin:0;font-size:30px}
#home > p{margin:0 0 12px;color:var(--muted);text-align:center;max-width:480px}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.big{min-height:50px;border-radius:14px;font-weight:600;font-size:16px;background:var(--raised)}
.big.go{background:var(--accent);color:#06281d}
input{font:inherit;font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;user-select:text}
.err{color:#ffb3b5;font-size:14px}

/* aula */
#call{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#14161b;border-bottom:1px solid var(--line)}
.top #status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{background:var(--rec);color:#fff;font-weight:700;border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.stage{position:relative;background:#000;overflow:hidden}
.stage > video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage > video.cam{object-fit:cover}
#wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px;white-space:pre-line;font-size:17px}
.mini{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:2}
.mini video{width:clamp(110px,16vw,220px);aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.85);background:#111;display:block}
.mini video.me{transform:scaleX(-1)}
.bar{display:flex;gap:8px;padding:10px 12px;background:#14161b;border-top:1px solid var(--line);justify-content:center;flex-wrap:wrap}
.bar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;background:none;min-width:84px;font-size:12px}
.bar button .ic{width:46px;height:46px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
.bar button:hover .ic{filter:brightness(1.2)}
.bar button.off .ic{background:#5a2a2e}
.bar button.on .ic{background:var(--accent);color:#06281d}
.bar button.danger .ic{background:var(--rec);color:#fff}
.bar svg{width:22px;height:22px}

/* janela pequena */
body.mini-mode .top,body.mini-mode .bar button:not(.keep),body.mini-mode .mini #me{display:none}
body.mini-mode .bar{padding:6px}
body.mini-mode .mini video{width:110px}

/* caixas */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(720px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.box h3{margin:0;font-size:19px}
.box p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.src{background:var(--raised);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.src img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000}
.src span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src:hover{outline:2px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.row button{min-height:44px;padding:0 18px;border-radius:12px;background:var(--raised);font-weight:600}
.row button.go{background:var(--accent);color:#06281d}
.qr{align-self:center;background:#fff;padding:10px;border-radius:12px;line-height:0}
.link{font-family:Consolas,monospace;background:var(--raised);border-radius:10px;padding:10px 12px;user-select:text;word-break:break-all;text-align:center}
select{font:inherit;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw}
</style>
</head>
<body>

<section id="home">
  <h1>Sala Mimi Explica</h1>
  <p>Aula ao vivo: vocês se veem, conversam e podem mostrar a tela um para o outro.</p>
  <div class="card">
    <h2>Sou o professor</h2>
    <p>Abre a sua sala. Só você pode gravar a aula.</p>
    <button class="big go" id="profBtn">Abrir minha sala</button>
  </div>
  <div class="card">
    <h2>Sou aluno</h2>
    <p>Digite o código que o professor passou.</p>
    <input id="codeIn" maxlength="8" placeholder="CÓDIGO" autocomplete="off" aria-label="Código da sala">
    <div class="err" id="homeErr" hidden></div>
    <button class="big" id="alunoBtn">Entrar na aula</button>
  </div>
</section>

<section id="call" hidden>
  <div class="top"><span id="status">Conectando…</span><span class="rec" id="recTag" hidden>● GRAVANDO 00:00</span></div>
  <div class="stage">
    <video id="big" class="cam" autoplay playsinline></video>
    <div id="wait"></div>
    <div class="mini">
      <video id="small" autoplay playsinline muted hidden></video>
      <video id="me" class="me" autoplay playsinline muted></video>
    </div>
  </div>
  <div class="bar" id="bar"></div>
</section>

<div class="modal" id="modal" hidden><div class="box" id="box"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="node_modules/peerjs/dist/peerjs.min.js"></script>
<script src="node_modules/qrcode-generator/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
