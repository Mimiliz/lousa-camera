<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Câmera da Lousa</title>
<style>
:root{--bg:#0d0f13;--panel:#1d2027;--raised:#272b34;--line:#323744;--fg:#eceef2;--muted:#8e96a5;--accent:#37c99a;--rec:#ff4a4f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;display:flex;align-items:center;gap:10px}
header b{font-size:18px}
header small{color:var(--muted)}
.stage{flex:1;min-height:0;position:relative;background:#000;margin:0 max(12px,env(safe-area-inset-left,0px));border-radius:18px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--rec);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.bar{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 16px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:50px;padding:0 18px;cursor:pointer;color:var(--fg);background:var(--raised);flex:1}
button.go{background:var(--accent);color:#06281d}
button.stop{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{margin:auto;max-width:440px;width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:22px}
.card p{margin:0;color:var(--muted)}
input{font:inherit;font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px}
.err{color:#ffb3b5;background:rgba(255,74,79,.12);border-radius:10px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
</style>
</head>
<body>
<header><b>Câmera da Lousa</b><small id="salaLbl"></small></header>

<div class="card" id="intro">
  <h1>Mostrar sua câmera na lousa do professor</h1>
  <p id="introTxt">A imagem da sua câmera vai aparecer ao vivo na lousa do Mimi Explica. Nada é instalado no seu celular.</p>
  <input id="code" maxlength="8" placeholder="CÓDIGO" autocomplete="off" hidden>
  <div class="err" id="err" hidden></div>
  <button class="go" id="startBtn">Ligar minha câmera</button>
</div>

<div class="stage" id="stage" hidden>
  <video id="me" playsinline autoplay muted></video>
  <div class="badge"><span class="dot" id="dot"></span><span id="status">Conectando…</span></div>
</div>
<audio id="prof" autoplay playsinline></audio>
<div class="bar" id="bar" hidden>
  <button id="flipBtn">Trocar câmera</button>
  <button id="muteBtn">Desligar meu som</button>
  <button class="stop" id="endBtn">Encerrar</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
let sala = (q.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const srv = q.get('srv');   // só para testes: servidor PeerJS próprio
const peerOpts = srv ? {host: srv.split(':')[0], port: +(srv.split(':')[1] || 9000), path: '/', secure: false} : {};
let stream = null, peer = null, call = null, facing = 'environment', muted = false, ended = false, retry = null;

if (sala){ $('#salaLbl').textContent = 'Sala ' + sala; }
else { $('#code').hidden = false; $('#introTxt').textContent = 'Digite o código que o professor passou para você.'; }

function setStatus(t, live){ $('#status').textContent = t; $('#dot').classList.toggle('on', !!live); }
function showErr(t){ $('#err').hidden = false; $('#err').textContent = t; }

async function getStream(){
  return navigator.mediaDevices.getUserMedia({
    video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}},
    audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}
  });
}

$('#startBtn').onclick = async () => {
  if (!sala){
    sala = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (sala.length < 4){ showErr('Digite o código completo.'); return; }
    $('#salaLbl').textContent = 'Sala ' + sala;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showErr('Este navegador não libera a câmera. Abra o link no Chrome ou no Safari.'); return; }
  try{ stream = await getStream(); }
  catch(e){ showErr('A câmera não foi liberada. Toque no cadeado ao lado do endereço, permita câmera e microfone e tente de novo.'); return; }
  $('#me').srcObject = stream;
  $('#intro').hidden = true; $('#stage').hidden = false; $('#bar').hidden = false;
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  connect();
};

function connect(){
  if (ended) return;
  setStatus('Conectando…');
  if (!peer || peer.destroyed){
    peer = new Peer(peerOpts);
    peer.on('open', () => dial());
    peer.on('disconnected', () => { if (!ended) peer.reconnect(); });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') setStatus('A lousa do professor ainda não está aberta. Tentando de novo…');
      else setStatus('Sem conexão. Tentando de novo…');
      schedule();
    });
  } else if (peer.open) dial();
}
function schedule(){ clearTimeout(retry); retry = setTimeout(() => { if (!call || !call.open) dial(); }, 3000); }
function dial(){
  if (ended || !peer || !peer.open) return;
  if (call){ try{ call.close(); }catch(e){} }
  call = peer.call('mimilousa-' + sala, stream);
  if (!call){ schedule(); return; }
  call.on('stream', s => { $('#prof').srcObject = s; setStatus('Ao vivo na lousa', true); });
  call.on('close', () => { if (!ended){ setStatus('A conexão caiu. Tentando de novo…'); schedule(); } });
  call.on('error', () => schedule());
  setTimeout(() => { if (call && !call.open && !ended){ setStatus('A lousa do professor ainda não está aberta. Tentando de novo…'); dial(); } }, 8000);
}

$('#flipBtn').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try{
    const ns = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}}});
    const nt = ns.getVideoTracks()[0], old = stream.getVideoTracks()[0];
    stream.removeTrack(old); old.stop(); stream.addTrack(nt);
    $('#me').srcObject = stream;
    const sender = call && call.peerConnection && call.peerConnection.getSenders().find(x => x.track && x.track.kind === 'video');
    if (sender) await sender.replaceTrack(nt);
  }catch(e){ setStatus('Não consegui trocar a câmera'); }
};
$('#muteBtn').onclick = () => {
  muted = !muted; stream.getAudioTracks().forEach(t => t.enabled = !muted);
  $('#muteBtn').textContent = muted ? 'Ligar meu som' : 'Desligar meu som';
};
$('#endBtn').onclick = () => {
  ended = true; clearTimeout(retry);
  try{ call && call.close(); }catch(e){} try{ peer && peer.destroy(); }catch(e){}
  stream && stream.getTracks().forEach(t => t.stop());
  setStatus('Encerrado. Pode fechar esta página.');
  $('#bar').hidden = true;
};
})();
</script>
</body>
</html>
