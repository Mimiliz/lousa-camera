<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Sala Mimi Explica</title>
<style>
:root{--bg:#0d0f13;--panel:#1d2027;--raised:#272b34;--line:#323744;--fg:#eceef2;--muted:#8e96a5;--accent:#37c99a;--rec:#ff4a4f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
header b{font-size:18px}
header small{color:var(--muted)}
.status{margin-left:auto;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--accent)}
.stage{flex:1;min-height:0;position:relative;background:#000;margin:0 max(10px,env(safe-area-inset-left,0px));border-radius:16px;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage video.cam{object-fit:cover}
.mini{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mini video{position:static;width:clamp(96px,26vw,200px);aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.85);background:#111}
.mini video.me{transform:scaleX(-1)}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
.bar{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 14px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:50px;padding:0 16px;cursor:pointer;color:var(--fg);background:var(--raised);flex:1;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button.off{background:#3a2326;color:#ffb3b5}
button.go,.btn.go{background:var(--accent);color:#06281d}
button.end{background:var(--rec);color:#fff}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{margin:auto;max-width:460px;width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:22px;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
input{font:inherit;font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px}
.err{color:#ffb3b5;background:rgba(255,74,79,.12);border-radius:10px;padding:10px 12px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
/* chat */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:#14161b;border-left:1px solid var(--line);z-index:8;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.chat header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.chat header button{flex:none;background:none;min-height:40px;width:40px;padding:0;font-size:22px;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--raised);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#1f5c48}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.msgs .empty{color:var(--muted);text-align:center;margin:auto;font-size:14px}
.chat form{display:flex;gap:8px;padding:10px}
.chat textarea{flex:1;min-width:0;resize:none;font:inherit;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;height:48px}
.chat form button{flex:none;background:var(--accent);color:#06281d}
button.locked{background:#3a2326;color:#ffb3b5;opacity:.85}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9;padding:20px}
.panel > div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:18px}
select{font:inherit;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header><b>Sala Mimi Explica</b><small id="salaLbl"></small><span class="status" id="statusBox" hidden><span class="dot" id="dot"></span><span id="status"></span></span></header>

<div class="card" id="intro">
  <h1>Entrar na aula</h1>
  <p id="introTxt">Você e o professor vão se ver e conversar ao vivo.</p>
  <input id="code" maxlength="8" placeholder="CÓDIGO" autocomplete="off" hidden aria-label="Código da sala">
  <div class="err" id="err" hidden></div>
  <a class="btn go" id="appBtn" href="#">Entrar pelo app (Android)</a>
  <p class="note" id="appNote">Primeira vez? <a id="dlLink" href="https://github.com/Mimiliz/lousa-camera/releases/latest/download/SalaMimi.apk" style="color:var(--accent)">Baixe o app Sala Mimi Explica</a>, instale e volte a este link.</p>
  <div class="or">ou</div>
  <button id="startBtn">Entrar pelo navegador</button>
</div>

<div class="stage" id="stage" hidden>
  <video id="big" class="cam" playsinline autoplay></video>
  <div class="wait" id="wait">Esperando o professor…</div>
  <div class="mini">
    <video id="profSmall" playsinline autoplay muted hidden></video>
    <video id="me" class="me" playsinline autoplay muted></video>
  </div>
</div>
<div class="bar" id="bar" hidden>
  <button id="micBtn">Microfone ligado</button>
  <button id="micSelBtn">Trocar microfone</button>
  <button id="camBtn">Câmera ligada</button>
  <button id="flipBtn">Trocar câmera</button>
  <button id="chatBtn">Chat</button>
  <button id="screenBtn" hidden>Compartilhar minha tela</button>
  <button class="end" id="endBtn">Sair</button>
</div>

<div class="panel" id="micPanel" hidden><div>
  <h3>Escolher microfone</h3>
  <select id="micSel" aria-label="Microfone"></select>
  <div style="display:flex;gap:8px"><button id="micCancel">Cancelar</button><button class="go" id="micOk">Usar este</button></div>
</div></div>
<aside class="chat" id="chat" hidden aria-label="Chat">
  <header>Chat da aula<button id="chatClose" aria-label="Fechar chat">×</button></header>
  <div class="msgs" id="msgs"><div class="empty">As mensagens desta aula aparecem aqui.</div></div>
  <form id="chatForm"><textarea id="chatIn" placeholder="Escreva uma mensagem" aria-label="Mensagem"></textarea><button type="submit">Enviar</button></form>
</aside>
<div class="toast" id="toast" hidden></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
let sala = (q.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const srv = q.get('srv');   // só para testes com servidor próprio
const peerOpts = srv ? {host: srv.split(':')[0], port: +(srv.split(':')[1] || 9000), path: '/', secure: false} : {};
const HOST = () => 'mimisala-' + sala;
let stream = null, peer = null, camCall = null, myScreen = null, myScreenCall = null, profCam = null, profScreen = null;
let facing = 'user', ended = false, retry = null, teacherMuted = false, toastT = null;
const toast = t => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 3500); };

/* recados entre professor e aluno (passam pelo mesmo servidor de encontro) */
function sendCtl(obj){ try{ peer && peer.open && peer.socket.send({type: 'CANDIDATE', dst: HOST(), payload: {type: 'media', connectionId: 'ctl', ctl: obj}}); }catch(e){} }
function sendMicState(){ const t = stream && stream.getAudioTracks()[0]; sendCtl({micOn: !!(t && t.enabled)}); }
let busy = false, unread = 0;
function onCtl(c){
  if (typeof c.chat === 'string'){ addMsg(c.chat.slice(0, 2000), false); return; }
  if (c.busy){ roomBusy(); return; }
  if (typeof c.mute !== 'boolean') return;
  teacherMuted = c.mute;
  const t = stream && stream.getAudioTracks()[0];
  if (t) t.enabled = !c.mute;
  paintMic();
  toast(c.mute ? 'O professor desligou o seu microfone' : 'O professor liberou o seu microfone');
  sendMicState();
}
function paintMic(){
  const t = stream && stream.getAudioTracks()[0], on = !!(t && t.enabled);
  const b = $('#micBtn');
  b.classList.toggle('locked', teacherMuted); b.classList.toggle('off', !on && !teacherMuted);
  b.textContent = teacherMuted ? 'Mutado pelo professor' : on ? 'Microfone ligado' : 'Microfone desligado';
}

const setStatus = (t, on) => { $('#statusBox').hidden = false; $('#status').textContent = t; $('#dot').classList.toggle('on', !!on); };
const showErr = t => { $('#err').hidden = false; $('#err').textContent = t; };

function appLink(){
  return 'intent://entrar?sala=' + encodeURIComponent(sala) + '#Intent;scheme=mimisala;package=br.com.mimiexplica.sala;S.browser_fallback_url=' +
    encodeURIComponent('https://github.com/Mimiliz/lousa-camera/releases/latest/download/SalaMimi.apk') + ';end';
}
function refreshIntro(){
  $('#salaLbl').textContent = sala ? 'Sala ' + sala : '';
  const android = /Android/i.test(navigator.userAgent);
  const windows = /Windows/i.test(navigator.userAgent);
  if (windows){
    $('#appBtn').textContent = 'Entrar pelo programa (Windows)';
    $('#appBtn').href = sala ? 'mimisala://entrar?sala=' + encodeURIComponent(sala) : '#';
    $('#dlLink').href = 'https://github.com/Mimiliz/lousa-camera/releases/latest/download/SalaMimi-Setup.exe';
    $('#dlLink').textContent = 'Baixe o programa Sala Mimi Explica';
  } else $('#appBtn').href = sala ? appLink() : '#';
  const native = android || windows;
  $('#appBtn').hidden = !native; $('#appNote').hidden = !native;
  document.querySelector('.or').hidden = !native;
}
if (!sala){ $('#code').hidden = false; $('#introTxt').textContent = 'Digite o código que o professor passou para você.'; }
$('#code').addEventListener('input', () => { sala = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); refreshIntro(); });
$('#appBtn').addEventListener('click', e => { if (sala.length < 4){ e.preventDefault(); showErr('Digite o código completo.'); } });
refreshIntro();

/* ---- telas: o que aparece grande ---- */
function layout(){
  const big = $('#big'), small = $('#profSmall');
  if (profScreen){
    big.srcObject = profScreen; big.className = '';
    small.hidden = !profCam; if (profCam) small.srcObject = profCam;
  } else if (profCam){
    big.srcObject = profCam; big.className = 'cam'; small.hidden = true;
  } else { big.srcObject = null; small.hidden = true; }
  $('#wait').hidden = !!(profScreen || profCam);
  big.play().catch(() => {});
}

$('#startBtn').onclick = async () => {
  if (sala.length < 4){ showErr('Digite o código completo.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showErr('Este navegador não libera a câmera. Use o Chrome, o Edge ou o Safari.'); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}},
      audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}
    });
  }catch(e){ showErr('A câmera e o microfone não foram liberados. Toque no cadeado ao lado do endereço, permita e tente de novo.'); return; }
  $('#me').srcObject = stream;
  $('#intro').hidden = true; $('#stage').hidden = false; $('#bar').hidden = false;
  $('#screenBtn').hidden = !(navigator.mediaDevices.getDisplayMedia && !/Android|iPhone|iPad/i.test(navigator.userAgent));
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  connect();
};

function connect(){
  if (ended) return;
  setStatus('Conectando…');
  peer = new Peer(peerOpts);
  peer.socket.on('message', m => { if (m && m.type === 'CANDIDATE' && m.payload && m.payload.ctl && m.src === HOST()) onCtl(m.payload.ctl); });
  peer.on('open', () => dial());
  peer.on('disconnected', () => { if (!ended) try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') setStatus('O professor ainda não abriu a sala…');
    else if (e.type !== 'negotiation-failed') setStatus('Sem conexão. Tentando de novo…');
    schedule();
  });
  // o professor liga para mostrar a tela dele
  peer.on('call', call => {
    if (call.peer !== HOST()){ try{ call.close(); }catch(e){} return; }
    const kind = (call.metadata && call.metadata.kind) || 'screen';
    call.answer();
    call.on('stream', s => {
      if (kind === 'screen'){ profScreen = s; watchEnd(s, () => { profScreen = null; layout(); }); }
      layout();
    });
    call.on('close', () => { if (kind === 'screen'){ profScreen = null; layout(); } });
  });
}
function watchEnd(s, done){
  const t = s.getVideoTracks()[0]; if (!t) return;
  t.addEventListener('ended', done);
  t.addEventListener('mute', () => setTimeout(() => { if (t.muted) done(); }, 2500));
}
function schedule(){ clearTimeout(retry); retry = setTimeout(() => { if (!camCall || !camCall.open) dial(); }, 3000); }
function roomBusy(){
  busy = true; clearTimeout(retry);
  const old = camCall; camCall = null; if (old){ try{ old.close(); }catch(e){} }
  profCam = null; profScreen = null; layout();
  setStatus('A sala está ocupada');
  $('#wait').textContent = 'O professor já está em aula com outro aluno. Confira se o código está certo ou peça um código novo.';
  $('#wait').hidden = false;
}
function dial(){
  if (ended || busy || !peer || !peer.open) return;
  if (camCall){ try{ camCall.close(); }catch(e){} }
  camCall = peer.call(HOST(), stream, {metadata: {kind: 'cam', via: 'navegador'}});
  if (!camCall){ schedule(); return; }
  camCall.on('stream', s => { profCam = s; layout(); setStatus('Na aula com o professor', true); sendMicState(); });
  const thisCall = camCall;
  camCall.on('close', () => { if (camCall !== thisCall) return; profCam = null; profScreen = null; layout(); if (!ended && !busy){ setStatus('A conexão caiu. Reconectando…'); schedule(); } });
  camCall.on('error', () => schedule());
  setTimeout(() => { if (camCall && !camCall.open && !ended){ setStatus('O professor ainda não abriu a sala…'); dial(); } }, 9000);
}

/* ---- chat ---- */
const hhmm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function addMsg(text, mine){
  const box = $('#msgs'); const e = box.querySelector('.empty'); if (e) e.remove();
  const m = document.createElement('div'); m.className = 'msg' + (mine ? ' mine' : '');
  const sm = document.createElement('small'); sm.textContent = (mine ? 'Você' : 'Professor') + ' · ' + hhmm();
  m.append(sm, document.createTextNode(text)); box.append(m); box.scrollTop = box.scrollHeight;
  if (!mine && $('#chat').hidden){ unread++; $('#chatBtn').textContent = 'Chat (' + unread + ')'; $('#chatBtn').classList.add('go'); toast('Professor: ' + text.slice(0, 80)); }
}
$('#chatBtn').onclick = () => { $('#chat').hidden = false; unread = 0; $('#chatBtn').textContent = 'Chat'; $('#chatBtn').classList.remove('go'); setTimeout(() => $('#chatIn').focus(), 50); };
$('#chatClose').onclick = () => { $('#chat').hidden = true; };
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#chatIn').value.trim(); if (!t) return;
  if (!profCam){ toast('Você ainda não está conectado ao professor'); return; }
  sendCtl({chat: t.slice(0, 2000)}); addMsg(t, true); $('#chatIn').value = '';
});
$('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); $('#chatForm').requestSubmit(); } });

$('#micBtn').onclick = () => {
  if (teacherMuted){ toast('O professor desligou o seu microfone. Ele precisa liberar para você falar.'); return; }
  const t = stream.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled;
  paintMic(); sendMicState();
};
$('#micSelBtn').onclick = async () => {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  const cur = stream.getAudioTracks()[0] ? stream.getAudioTracks()[0].getSettings().deviceId : '';
  $('#micSel').innerHTML = devs.map((d, i) => `<option value="${d.deviceId}" ${d.deviceId === cur ? 'selected' : ''}>${(d.label || 'Microfone ' + (i + 1)).replace(/</g, '&lt;')}</option>`).join('');
  $('#micPanel').hidden = false;
};
$('#micCancel').onclick = () => { $('#micPanel').hidden = true; };
$('#micOk').onclick = async () => {
  $('#micPanel').hidden = true;
  const id = $('#micSel').value;
  try{
    const ns = await navigator.mediaDevices.getUserMedia({audio: {deviceId: {exact: id}, echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    const nt = ns.getAudioTracks()[0], old = stream.getAudioTracks()[0];
    nt.enabled = teacherMuted ? false : (old ? old.enabled : true);
    if (old){ stream.removeTrack(old); old.stop(); }
    stream.addTrack(nt);
    const snd = camCall && camCall.peerConnection && camCall.peerConnection.getSenders().find(x => x.track ? x.track.kind === 'audio' : false);
    if (snd) await snd.replaceTrack(nt);
    toast('Microfone trocado');
  }catch(e){ toast('Não consegui usar esse microfone'); }
};
$('#camBtn').onclick = () => {
  const t = stream.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled;
  $('#camBtn').textContent = t.enabled ? 'Câmera ligada' : 'Câmera desligada'; $('#camBtn').classList.toggle('off', !t.enabled);
};
$('#flipBtn').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try{
    const ns = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}}});
    const nt = ns.getVideoTracks()[0], old = stream.getVideoTracks()[0];
    nt.enabled = old.enabled; stream.removeTrack(old); old.stop(); stream.addTrack(nt);
    $('#me').srcObject = stream; $('#me').classList.toggle('me', facing === 'user');
    const snd = camCall && camCall.peerConnection && camCall.peerConnection.getSenders().find(x => x.track && x.track.kind === 'video');
    if (snd) await snd.replaceTrack(nt);
  }catch(e){ setStatus('Não consegui trocar a câmera'); }
};
$('#screenBtn').onclick = async () => {
  if (myScreen){ stopMyScreen(); return; }
  try{ myScreen = await navigator.mediaDevices.getDisplayMedia({video: {frameRate: 15}, audio: false}); }
  catch(e){ return; }
  myScreen.getVideoTracks()[0].addEventListener('ended', stopMyScreen);
  myScreenCall = peer.call(HOST(), myScreen, {metadata: {kind: 'screen'}});
  $('#screenBtn').textContent = 'Parar de compartilhar'; $('#screenBtn').classList.add('go');
};
function stopMyScreen(){
  try{ myScreenCall && myScreenCall.close(); }catch(e){}
  myScreen && myScreen.getTracks().forEach(t => t.stop());
  myScreen = null; myScreenCall = null;
  $('#screenBtn').textContent = 'Compartilhar minha tela'; $('#screenBtn').classList.remove('go');
}
$('#endBtn').onclick = () => {
  ended = true; clearTimeout(retry); stopMyScreen();
  try{ camCall && camCall.close(); }catch(e){} try{ peer && peer.destroy(); }catch(e){}
  stream && stream.getTracks().forEach(t => t.stop());
  profCam = profScreen = null; layout();
  $('#wait').textContent = 'Você saiu da aula. Pode fechar esta página.'; $('#wait').hidden = false;
  $('#bar').hidden = true; setStatus('Fora da aula');
};
})();
</script>
</body>
</html>
