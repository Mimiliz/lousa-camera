<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lousa: receber câmera</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8e96a5;
  font:600 14px system-ui,sans-serif;padding:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" playsinline autoplay></video>
<div id="msg">Esperando a câmera…</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const q = new URLSearchParams(location.search);
const sala = (q.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const wantMic = q.get('mic') !== '0';
const srv = q.get('srv');
const peerOpts = srv ? {host: srv.split(':')[0], port: +(srv.split(':')[1] || 9000), path: '/', secure: false} : {};
const v = document.getElementById('v'), msg = document.getElementById('msg');
let peer = null, current = null, mic = null;
const tell = t => { try{ window.Lousa && window.Lousa.status(t); }catch(e){} };
const show = t => { msg.hidden = !t; msg.textContent = t || ''; };

async function getMic(){
  if (!wantMic) return null;
  if (mic) return mic;
  try{ mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); }catch(e){ mic = null; }
  return mic;
}
function start(){
  peer = new Peer('mimilousa-' + sala, peerOpts);
  peer.on('open', () => { show('Esperando a câmera…'); tell('Sala aberta. Esperando a câmera entrar.'); });
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id'){ show('Abrindo a sala…'); setTimeout(() => { try{ peer.destroy(); }catch(_){} start(); }, 4000); }
    else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error'){ show('Sem internet. Tentando de novo…'); setTimeout(() => { try{ peer.destroy(); }catch(_){} start(); }, 4000); }
  });
  peer.on('call', async call => {
    if (current){ try{ current.close(); }catch(e){} }
    current = call;
    const m = await getMic();
    call.answer(m || undefined);
    call.on('stream', s => { v.srcObject = s; v.play().catch(() => {}); show(''); tell('Câmera conectada'); });
    call.on('close', () => { if (current === call){ v.srcObject = null; show('A câmera saiu. Esperando de novo…'); tell('A câmera desconectou'); } });
  });
}
if (!sala) show('Sala sem código'); else start();
})();
</script>
</body>
</html>
